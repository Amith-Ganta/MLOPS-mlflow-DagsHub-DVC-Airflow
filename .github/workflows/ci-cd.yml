name: CI/CD Pipeline
# Accenture MLOps stack: CI (dvc repro + F1 gate) → CD (Docker build/push)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  # ─── CI: run DVC pipeline, evaluate model, gate on F1 ───────────────────────
  ci:
    name: CI - Train & Evaluate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dvc[http] mlflow scikit-learn xgboost pandas numpy joblib fastapi uvicorn pydantic

      - name: Configure DVC remote credentials
        run: |
          dvc remote modify dagshub_remote --local auth basic
          dvc remote modify dagshub_remote --local user Amith-Ganta
          dvc remote modify dagshub_remote --local password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull data from DagsHub DVC remote
        run: dvc pull dataset/returns_dataset.csv.dvc --no-run-cache

      - name: Patch dvc.yaml for Linux (replace Windows venv path with 'python')
        run: |
          sed -i 's|C:/Users/HP/Desktop/NLP/API/GenAI_Krish_part-1-2-3/UDEMY-AGENITIC-AI-KRISH/Terraform/DVC-Project/.venv/Scripts/python.exe|python|g' dvc.yaml

      - name: Run DVC pipeline (preprocess → train → evaluate)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: dvc repro

      - name: Show metrics
        run: dvc metrics show

      - name: Check evaluation gate (F1 >= 0.70)
        run: python src/evaluate.py

      - name: Push updated artifacts to DVC remote
        if: github.ref == 'refs/heads/main'
        run: dvc push

      - name: Upload model artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: artifacts/

  # ─── CD: build and push Docker image ────────────────────────────────────────
  cd:
    name: CD - Docker Build & Push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: model-artifact
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/product-return-api:latest
            ${{ secrets.DOCKER_USERNAME }}/product-return-api:${{ github.sha }}
