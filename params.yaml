preprocess:
  input: dataset/returns_dataset.csv
  output: dataset/processed_data.csv
  test_size: 0.20
  random_state: 42

train:
  data: dataset/processed_data.csv
  model: artifacts/model_data.joblib
  random_state: 42
  n_estimators: 300
  max_depth: 5
  learning_rate: 0.05
  cost_fn: 5.0
  cost_fp: 1.0

evaluate:
  data: dataset/processed_data.csv
  model: artifacts/model_data.joblib
  min_f1_threshold: 0.70
