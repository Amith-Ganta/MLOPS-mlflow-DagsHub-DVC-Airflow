version: "3.8"

# Airflow for Continuous Training (CT)
# Start: docker compose -f docker-compose.airflow.yml up -d
# UI: http://localhost:8080  (user: airflow / pass: airflow)
#
# Before starting, set these env vars in .env (or export them):
#   DAGSHUB_TOKEN=your_token

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Install dvc + ML packages needed by the CT pipeline tasks
    _PIP_ADDITIONAL_REQUIREMENTS: "dvc[http] scikit-learn xgboost pandas numpy joblib mlflow dagshub"
    # DagsHub token injected into DAG tasks via Airflow Variable
    DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
    # Path to the project inside the container
    PROJECT_PATH: /opt/airflow/project
    PYTHON_BIN: python
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    # Mount the whole project so the DAG can run train.py, etc.
    - .:/opt/airflow/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - airflow-postgres:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username airflow --password airflow \
          --firstname Amith --lastname Ganta \
          --role Admin --email gantaamith007@gmail.com
        # Set the Airflow Variables the DAG reads
        airflow variables set PROJECT_PATH /opt/airflow/project
        airflow variables set PYTHON_BIN python
        airflow variables set DAGSHUB_TOKEN "${DAGSHUB_TOKEN:-}"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
      PROJECT_PATH: /opt/airflow/project
      PYTHON_BIN: python
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # The FastAPI serving API (separate from Airflow)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  airflow-postgres:
