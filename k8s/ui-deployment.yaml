apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-return-ui
  labels:
    app: product-return-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-return-ui
  template:
    metadata:
      labels:
        app: product-return-ui
    spec:
      containers:
        - name: ui
          image: amith98480/product-return-ui:latest
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://product-return-api-svc:8000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5
