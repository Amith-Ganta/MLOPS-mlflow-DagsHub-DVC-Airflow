apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-return-api
  labels:
    app: product-return-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-return-api
  template:
    metadata:
      labels:
        app: product-return-api
    spec:
      containers:
        - name: api
          image: amith98480/product-return-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DAGSHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DAGSHUB_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
